<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc"><title id="title">EduHarness: scene-level generation, verification, and repair</title><desc id="desc">A planning agent creates a lesson blueprint. Each scene is prepared with TTS narration and one of Image, Manim, Remotion, or Interactive tools. Narration duration informs tool preparation. Local rendering produces visual evidence; an independent VLM reviews frames or screenshots against the teaching brief and key elements with deterministic guard findings. The default quality gate requires a successful review, no blocking defects, and a score at or above the threshold tau. Failed scenes are patched or regenerated, rendered, and reviewed again. All scenes must pass the default gate before packaging into an EduBundle player.</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#718592"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#AD5438"/></marker><marker id="accepted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#34735A"/></marker></defs><rect x="0" y="0" width="1600" height="600" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="20" y="39" font-family="Inter, WenQuanYi Micro Hei, sans-serif" font-size="26" font-weight="650" fill="#38678F" text-anchor="start">1  Lesson planning</text><path d="M20 55 H328" fill="none" stroke="#D3DDE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="368" y="39" font-family="Inter, WenQuanYi Micro Hei, sans-serif" font-size="26" font-weight="650" fill="#38678F" text-anchor="start">2  Scene generation and verification</text><path d="M368 55 H1324" fill="none" stroke="#D3DDE4" stroke-width="2" stroke-linecap=