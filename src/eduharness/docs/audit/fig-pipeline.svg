<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1452 430" width="1452" height="430" role="img" aria-label="EduHarness pipeline: request, planner, per-scene prepare-render-review loop with repair, bundle, player"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#2A332D"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#B4423D"/></marker></defs><rect x="0" y="0" width="1452" height="430" fill="#FFFFFF"/><rect x="424" y="58" width="600" height="272" rx="4" fill="#F2F4F1" stroke="#2A332D" stroke-opacity="0.55" stroke-width="1.1" stroke-dasharray="6 4"/><text x="724.0" y="80.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.8" fill="#17201B" fill-opacity="0.66" font-weight="600" text-anchor="middle" letter-spacing="0.4">Stage 2  ·  per-scene loop, at most R review rounds</text><rect x="28" y="104" width="152" height="84" rx="3" fill="#FFFFFF" stroke="#2A332D" stroke-width="1.3"/><text x="104.0" y="138.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">Lesson request</text><text x="104.0" y="158.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">topic · audience</text><text x="104.0" y="172.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">source material</text><rect x="226" y="104" width="152" height="84" rx="3" fill="#E4EDF2" stroke="#356B8F" stroke-width="1.3"/><text x="302.0" y="125.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#356B8F" fill-opacity="0.95" font-weight="700" text-anchor="middle" letter-spacing="1.1">STAGE 1</text><text x="302.0" y="149.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">Planner</text><text x="302.0" y="167.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">one structured</text><text x="302.0" y="181.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">LLM call</text><rect x="456" y="104" width="152" height="84" rx="3" fill="#E4EDF2" stroke="#356B8F" stroke-width="1.3"/><text x="532.0" y="138.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">Prepare</text><text x="532.0" y="158.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">tool specs, images,</text><text x="532.0" y="172.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">narration</text><rect x="654" y="104" width="152" height="84" rx="3" fill="#FFFFFF" stroke="#2A332D" stroke-width="1.3"/><text x="730.0" y="138.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">Render</text><text x="730.0" y="158.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">sandboxed,</text><text x="730.0" y="172.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">offline</text><rect x="852" y="104" width="152" height="84" rx="3" fill="#E4EDF2" stroke="#356B8F" stroke-width="1.3"/><text x="928.0" y="138.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">Review</text><text x="928.0" y="158.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">vision audit over</text><text x="928.0" y="172.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">sampled frames</text><rect x="1070" y="104" width="152" height="84" rx="3" fill="#FFFFFF" stroke="#2A332D" stroke-width="1.3"/><text x="1146.0" y="125.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#356B8F" fill-opacity="0.95" font-weight="700" text-anchor="middle" letter-spacing="1.1">STAGE 3</text><text x="1146.0" y="149.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">EduBundle</text><text x="1146.0" y="167.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">manifest, media,</text><text x="1146.0" y="181.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">interactive JSON</text><rect x="1268" y="104" width="152" height="84" rx="3" fill="#FFFFFF" stroke="#2A332D" stroke-width="1.3"/><text x="1344.0" y="138.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#17201B" fill-opacity="1.0" font-weight="700" text-anchor="middle" letter-spacing="0">Player</text><text x="1344.0" y="158.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">narrated video +</text><text x="1344.0" y="172.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#17201B" fill-opacity="0.72" font-weight="400" text-anchor="middle" letter-spacing="0">practice nodes</text><rect x="456" y="204" width="152" height="68" rx="3" fill="#FFFFFF" stroke="#2A332D" stroke-opacity="0.55" stroke-width="1"/><text x="532.0" y="223.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.4" fill="#17201B" fill-opacity="0.62" font-weight="600" text-anchor="middle" letter-spacing="0.3">four scene types</text><text x="532.0" y="242.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17201B" fill-opacity="0.85" font-weight="500" text-anchor="middle" letter-spacing="0">image · manim</text><text x="532.0" y="257.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17201B" fill-opacity="0.85" font-weight="500" text-anchor="middle" letter-spacing="0">remotion · interactive</text><rect x="654" y="204" width="152" height="68" rx="3" fill="#FFFFFF" stroke="#2A332D" stroke-opacity="0.55" stroke-width="1"/><text x="730.0" y="223.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.4" fill="#17201B" fill-opacity="0.62" font-weight="600" text-anchor="middle" letter-spacing="0.3">deterministic guard</text><text x="730.0" y="242.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17201B" fill-opacity="0.85" font-weight="500" text-anchor="middle" letter-spacing="0">measured overlap,</text><text x="730.0" y="257.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#17201B" fill-opacity="0.85" font-weight="500" text-anchor="middle" letter-spacing="0">clipping, blank frames</text><path d="M 180 146.0 L 220 146.0" fill="none" stroke="#2A332D" stroke-width="1.4" marker-end="url(#a)"/><path d="M 378 146.0 L 450 146.0" fill="none" stroke="#2A332D" stroke-width="1.4" marker-end="url(#a)"/><text x="417.0" y="136.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.4" fill="#17201B" fill-opacity="0.7" font-weight="600" text-anchor="middle" letter-spacing="0">blueprint</text><path d="M 608 146.0 L 648 146.0" fill="none" stroke="#2A332D" stroke-width="1.4" marker-end="url(#a)"/><path d="M 806 146.0 L 846 146.0" fill="none" stroke="#2A332D" stroke-width="1.4" marker-end="url(#a)"/><path d="M 1004 146.0 L 1064 146.0" fill="none" stroke="#2A332D" stroke-width="1.4" marker-end="url(#a)"/><text x="1037.0" y="136.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.4" fill="#17201B" fill-opacity="0.75" font-weight="600" text-anchor="middle" letter-spacing="0">pass</text><path d="M 1222 146.0 L 1262 146.0" fill="none" stroke="#2A332D" stroke-width="1.4" marker-end="url(#a)"/><path d="M 806 238.0 L 954 238.0 L 954 194" fill="none" stroke="#2A332D" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="962.0" y="231.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.2" fill="#17201B" fill-opacity="0.62" font-weight="500" text-anchor="start" letter-spacing="0">evidence</text><path d="M 914 188 L 914 302 L 436 302 L 436 170 L 450 170" fill="none" stroke="#B4423D" stroke-width="1.4" marker-end="url(#r)"/><text x="675.0" y="294.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.8" fill="#B4423D" fill-opacity="1.0" font-weight="600" text-anchor="middle" letter-spacing="0">fail  →  repair: apply patch ops, else regenerate the scene</text><text x="28.0" y="364.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.6" fill="#17201B" fill-opacity="0.8" font-weight="400" text-anchor="start" letter-spacing="0">Figure 1:  The EduHarness pipeline.  A single planning call turns a lesson request into a scene-level blueprint (scenes, checkable key elements, narration and a pinned style board).</text><text x="28.0" y="381.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.6" fill="#17201B" fill-opacity="0.8" font-weight="400" text-anchor="start" letter-spacing="0">Each scene is then prepared, rendered in a sandbox, and audited by a deterministic layout guard together with an independent vision reviewer that must account for every key element.</text><text x="28.0" y="398.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.6" fill="#17201B" fill-opacity="0.8" font-weight="400" text-anchor="start" letter-spacing="0">A scene is packaged only once it clears both; otherwise it re-enters the loop as a targeted repair, at most R times.  Shaded stages are the only ones that call a model.</text></svg>