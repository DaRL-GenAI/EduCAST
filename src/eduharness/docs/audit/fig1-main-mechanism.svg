<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" role="img" aria-label="EduHarness 主机制：Stage 1 产出 blueprint，Stage 2 的 prepare / render / review 三个幂等 pass 围绕 prepared_scenes.json 与 rendered_scenes.json 两个 checkpoint 循环最多三轮，Stage 3 打包成 EduBundle">
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,1 10,5 0,9" fill="#17201B"></polygon>
            </marker>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,1 10,5 0,9" fill="#17201B" opacity="0.55"></polygon>
            </marker>
          </defs>
<rect x="0" y="0" width="980" height="452" fill="#FAFBF8"/>

          <!-- Stage 2 container -->
          <rect x="250" y="40" width="520" height="344" rx="4" fill="none"
                stroke="#17201B" stroke-opacity="0.3" stroke-dasharray="5 4"></rect>
          <text x="266" y="62" font-family="IBM Plex Mono, monospace" font-size="12"
                fill="#17201B" opacity="0.62" letter-spacing="0.08em">STAGE 2 — 三个幂等 PASS</text>

          <!-- Stage 1 -->
          <rect x="20" y="85" width="164" height="76" rx="3" fill="none" stroke="#17201B" stroke-width="1.3"></rect>
          <text x="34" y="110" font-family="IBM Plex Mono, monospace" font-size="11" fill="#17201B" opacity="0.6" letter-spacing="0.08em">STAGE 1</text>
          <text x="34" y="132" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="600" fill="#17201B">Main Agent</text>
          <text x="34" y="151" font-size="12" fill="#17201B" opacity="0.62">规划 scenes + style</text>
          <g color="#356B8F">
            <line x1="184" y1="123" x2="243" y2="123" stroke="#17201B" stroke-width="1.4" marker-end="url(#ah)"></line>
          </g>
          <text x="188" y="115" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#17201B" opacity="0.62">blueprint</text>

          <!-- three passes -->
          <g>
            <rect x="272" y="85" width="146" height="76" rx="3" fill="#FAFBF8" stroke="#17201B" stroke-width="1.3"></rect>
            <text x="286" y="112" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="600" fill="#17201B">prepare</text>
            <text x="286" y="131" font-size="11.5" fill="#17201B" opacity="0.66">tool spec · 配图</text>
            <text x="286" y="148" font-size="11.5" fill="#17201B" opacity="0.66">旁白 TTS</text>
            <text x="404" y="103" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#356B8F">API</text>

            <rect x="434" y="85" width="146" height="76" rx="3" fill="#FAFBF8" stroke="#17201B" stroke-width="1.3"></rect>
            <text x="448" y="112" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="600" fill="#17201B">render</text>
            <text x="448" y="131" font-size="11.5" fill="#17201B" opacity="0.66">Manim / Remotion</text>
            <text x="448" y="148" font-size="11.5" fill="#17201B" opacity="0.66">合成 · 混旁白</text>
            <text x="566" y="103" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#16734A">本地</text>

            <rect x="596" y="85" width="146" height="76" rx="3" fill="#FAFBF8" stroke="#17201B" stroke-width="1.3"></rect>
            <text x="610" y="112" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="600" fill="#17201B">review</text>
            <text x="610" y="131" font-size="11.5" fill="#17201B" opacity="0.66">guard + VLM</text>
            <text x="610" y="148" font-size="11.5" fill="#17201B" opacity="0.66">见图二</text>
            <text x="728" y="103" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#356B8F">API</text>
          </g>
          <g color="#17201B">
            <line x1="418" y1="123" x2="428" y2="123" stroke="#17201B" stroke-width="1.4" marker-end="url(#ah)"></line>
            <line x1="580" y1="123" x2="590" y2="123" stroke="#17201B" stroke-width="1.4" marker-end="url(#ah)"></line>
          </g>

          <!-- repair loop -->
          <g color="#356B8F">
            <path d="M 669 161 L 669 198 L 345 198 L 345 161" fill="none" stroke="#17201B"
                  stroke-width="1.4" marker-end="url(#ah)"></path>
          </g>
          <text x="507" y="191" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#356B8F">
            未通过的 scene → repairs_by_id
          </text>
          <text x="507" y="215" text-anchor="middle" font-size="11.5" fill="#17201B" opacity="0.66">
            每轮只重做失败的那几个 · 最多 max_review_rounds = 3 轮
          </text>

          <!-- checkpoints -->
          <rect x="272" y="262" width="470" height="96" rx="3" fill="#E7ECE6" stroke="#17201B" stroke-opacity="0.35"></rect>
          <text x="288" y="288" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#17201B">prepared_scenes.json</text>
          <text x="288" y="310" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#17201B">rendered_scenes.json</text>
          <text x="288" y="336" font-size="11.5" fill="#17201B" opacity="0.68">scene 级单独落盘，附 prepare / render fingerprint</text>
          <text x="726" y="288" text-anchor="end" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="600" fill="#16734A">fingerprint 判定</text>
          <text x="726" y="308" text-anchor="end" font-size="11.5" fill="#17201B" opacity="0.68">复用，还是重做</text>
          <text x="726" y="326" text-anchor="end" font-size="11.5" fill="#17201B" opacity="0.68">（含模块自身文件摘要）</text>

          <g color="#17201B" opacity="0.6">
            <line x1="345" y1="230" x2="345" y2="258" stroke="#17201B" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah2)"></line>
            <line x1="345" y1="258" x2="345" y2="230" stroke="#17201B" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah2)"></line>
            <line x1="507" y1="230" x2="507" y2="258" stroke="#17201B" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah2)"></line>
            <line x1="507" y1="258" x2="507" y2="230" stroke="#17201B" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah2)"></line>
            <line x1="669" y1="230" x2="669" y2="258" stroke="#17201B" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah2)"></line>
            <line x1="669" y1="258" x2="669" y2="230" stroke="#17201B" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah2)"></line>
          </g>

          <!-- Stage 3 -->
          <g color="#17201B">
            <line x1="770" y1="123" x2="796" y2="123" stroke="#17201B" stroke-width="1.4" marker-end="url(#ah)"></line>
          </g>
          <rect x="800" y="85" width="160" height="76" rx="3" fill="none" stroke="#17201B" stroke-width="1.3"></rect>
          <text x="814" y="110" font-family="IBM Plex Mono, monospace" font-size="11" fill="#17201B" opacity="0.6" letter-spacing="0.08em">STAGE 3</text>
          <text x="814" y="132" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="600" fill="#17201B">bundler</text>
          <text x="814" y="151" font-size="12" fill="#17201B" opacity="0.62">结构性缺陷直接拦</text>
          <text x="880" y="188" text-anchor="middle" font-size="11.5" fill="#17201B" opacity="0.68">EduBundle</text>
          <text x="880" y="206" text-anchor="middle" font-size="11.5" fill="#17201B" opacity="0.68">manifest + 播放器</text>

          <!-- footnote inside plate -->
          <text x="20" y="410" font-size="12" fill="#17201B" opacity="0.66">
            resume 时：读回两个 checkpoint，保留已通过的 scene，只对预算内的失败项继续 —— 但预算算法有问题，见问题 3。
          </text>
          <text x="20" y="432" font-size="12" fill="#17201B" opacity="0.66">
            prepare 与 review 要 API key，render 纯本地：这条切线就是 Colab 混合流程（<tspan font-family="IBM Plex Mono, monospace" font-size="11.5">--stage 2-prepare / 2-render / 2-review</tspan>）的分界。
          </text>
        </svg>